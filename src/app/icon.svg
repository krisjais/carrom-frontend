<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="boardGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A1B10" />
      <stop offset="100%" stop-color="#140D08" />
    </radialGradient>
    <radialGradient id="queenGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF5E57" />
      <stop offset="60%" stop-color="#D63031" />
      <stop offset="100%" stop-color="#8E1414" />
    </radialGradient>
    <radialGradient id="goldRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#F2C94C" />
      <stop offset="100%" stop-color="#B8860B" />
    </radialGradient>
  </defs>

  <!-- Board Base -->
  <rect width="64" height="64" rx="14" fill="#0B0D0E" stroke="#F2C94C" stroke-width="2" />
  <rect x="4" y="4" width="56" height="56" rx="10" fill="url(#boardGrad)" stroke="#3D2614" stroke-width="1.5" />

  <!-- Carrom Center Outer Pattern -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#F2C94C" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#F2C94C" stroke-width="1" opacity="0.6" />

  <!-- Center Queen Coin -->
  <circle cx="32" cy="32" r="8" fill="url(#queenGrad)" stroke="#F2C94C" stroke-width="1.5" />
  <circle cx="32" cy="32" r="3" fill="#F2C94C" />

  <!-- Corner Pocket Accents -->
  <circle cx="10" cy="10" r="3" fill="#0B0D0E" stroke="#3D2614" stroke-width="1" />
  <circle cx="54" cy="10" r="3" fill="#0B0D0E" stroke="#3D2614" stroke-width="1" />
  <circle cx="10" cy="54" r="3" fill="#0B0D0E" stroke="#3D2614" stroke-width="1" />
  <circle cx="54" cy="54" r="3" fill="#0B0D0E" stroke="#3D2614" stroke-width="1" />
</svg>
