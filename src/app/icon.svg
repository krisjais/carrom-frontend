<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Red Radial Gradient for the Queen Coin -->
    <radialGradient id="queenGrad" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="45%" stop-color="#E74C3C" />
      <stop offset="100%" stop-color="#C0392B" />
    </radialGradient>
    
    <!-- Subtle drop shadow glow behind the Queen -->
    <filter id="queenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E74C3C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circle Frame (White / Floral with Khaki border) -->
  <circle cx="32" cy="32" r="30" fill="#FAF9F6" stroke="#D5C4A1" stroke-width="2" />

  <!-- Center Red Queen Carrom Coin with Glow -->
  <circle cx="32" cy="32" r="14" fill="url(#queenGrad)" stroke="#B02A1E" stroke-width="1" filter="url(#queenGlow)" />

  <!-- Concentric Inner Groove Ring -->
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="0.85" stroke-opacity="0.5" />

  <!-- Center White Dot of the Queen -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" fill-opacity="0.85" />
</svg>
